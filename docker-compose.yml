#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/eurovision-by-vincent:latest
    restart: on-failure:5
    environment:
      - PORT=3016
      - TOKENS=${TOKENS}
    ports:
      - "3016:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
