<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eurovision Rangliste</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>Eurovision Live-Rangliste</h1>
      </header>

      <section class="columns">
        <div class="panel" data-list-container="notRanked">
          <h2>Noch nicht bewertet</h2>
          <ul id="notRankedList" class="song-list" aria-label="Noch nicht bewertete Lieder"></ul>
          <p class="hint">Neue Lieder erscheinen hier automatisch alle paar Sekunden.</p>
        </div>

        <div class="panel" data-list-container="ranked">
          <h2>Deine Rangliste</h2>
          <ul id="rankedList" class="song-list" aria-label="Deine bewerteten Lieder"></ul>
          <p class="hint">Oben ist dein Favorit. Per Ziehen neu sortieren.</p>
        </div>
      </section>

      <p id="emptyState" class="empty-state" hidden>Noch keine Lieder verf&uuml;gbar.</p>
    </main>

    <template id="songTemplate">
      <li class="song-item" draggable="true">
        <div class="flag-media">
          <img class="flag" src="#" alt="Country flag" />
        </div>
        <div class="song-text">
          <strong class="song-title"></strong>
          <span class="song-artist"></span>
        </div>
        <div class="media">
          <a class="link-youtube" href="#"><img class="youtube" src="youtube.svg" alt="YouTube Video" class="media-icon" /></a>
          <a class="link-spotify" href="#"><img class="spotify" src="spotify.svg" alt="Spotify Song" class="media-icon" /></a>
        </div>
      </li>
    </template>

    <script src="/node_modules/sortablejs/Sortable.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
